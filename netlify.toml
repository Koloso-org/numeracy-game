# Netlify configuration for the Number Rules web build.
# With this file, connecting the repo in Netlify needs no manual settings —
# it builds and deploys automatically on every push.

[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # These EXPO_PUBLIC_* values are inlined into the web bundle at build time.
  # The Supabase anon/publishable key is designed to be public (the database is
  # protected by Row Level Security), so it is safe to keep here.
  EXPO_PUBLIC_SUPABASE_URL = "https://vdmowfyufftvlhltqmrg.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_0Sm8ftOf8zzxCFAKcpXssg_ZtZ2Tryz"
  EXPO_PUBLIC_LOGIN_EMAIL_DOMAIN = "koloso.app"

# Single-page app: serve index.html for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
